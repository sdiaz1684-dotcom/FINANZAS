<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Mis finanzas personales">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F1; --paper:#FFFFFF; --ink:#000000; --muted:#666666; --line:#D4D4D4;
  --in:#0D8A3E; --out:#C62828; --accent:#000000; --accent-ink:#FFFFFF; --soft:#ECECEC; --c1:#B5B5B5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --paper:#151515; --ink:#FFFFFF; --muted:#9C9C9C; --line:#333333;
    --in:#36C46B; --out:#FF5A4F; --accent:#FFFFFF; --accent-ink:#000000; --soft:#222222; --c1:#5E5E5E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --paper:#151515; --ink:#FFFFFF; --muted:#9C9C9C; --line:#333333;
  --in:#36C46B; --out:#FF5A4F; --accent:#FFFFFF; --accent-ink:#000000; --soft:#222222; --c1:#5E5E5E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 110px}

/* Encabezado */
.top{display:flex;align-items:center;gap:6px;margin:4px 0 14px}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:22px;line-height:1;display:grid;place-items:center}
.arrow:disabled{opacity:.3}
.mselect{flex:1;appearance:none;-webkit-appearance:none;border:0;background:transparent;text-align:center;text-align-last:center;font-weight:800;font-size:22px;letter-spacing:-.01em;text-transform:capitalize;padding:6px 0}
.more{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:22px}

/* Resumen */
.hero{padding:6px 4px 14px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .row{display:flex;gap:18px;margin-top:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.hero .row b{font-weight:700}
.pos{color:var(--in)} .neg{color:var(--out)}

/* Tira del saldo */
.openline{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px;border-top:2px solid var(--ink);font-weight:700}
.openline small{display:block;font-weight:500;color:var(--muted);font-size:13px}

.sec{background:var(--paper);border-radius:14px;margin:10px 0;padding:6px 0 0;border:1px solid var(--line)}
.sec h2{margin:0;padding:10px 16px 6px;font-size:15px;font-weight:700;color:var(--muted)}
.sw{position:relative;overflow:hidden;border-top:1px solid var(--soft)}
.sec h2+.sw,.startline+.sw{border-top:0}
.swbg{position:absolute;inset:0;background:var(--out);color:#FFFFFF;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;font-weight:800;font-size:15px}
.item{position:relative;display:flex;align-items:flex-start;gap:10px;padding:10px 12px 10px 8px;background:var(--paper);touch-action:pan-y;transition:transform .2s ease;user-select:none;-webkit-user-select:none}
.item.dragging{transition:none}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;margin-top:1px;display:grid;place-items:center;font-size:15px;color:transparent}
.check.on{background:var(--in);border-color:var(--in);color:#FFFFFF}
.body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;gap:10px;align-items:flex-start}
.body .txt{flex:1;min-width:0}
.concept{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:1px}
.item.done .concept,.item.done .amt{opacity:.45}
.add{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--soft);background:transparent;padding:12px 16px;color:var(--in);font-weight:700}
.closing{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 14px;border-top:2px dashed var(--line)}
.closing span{color:var(--muted);font-size:14px}
.closing b{font-size:24px;font-weight:800;letter-spacing:-.02em}

.newmonth{display:block;width:100%;margin:18px 0 6px;padding:16px;border-radius:14px;border:2px dashed var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:17px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:0 10px}
.empty{text-align:center;padding:40px 10px}
.empty h1{font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;max-width:186px;border:0;background:transparent;padding:12px 4px 14px;font-weight:700;color:var(--muted);font-size:14px}
.nav button.on{color:var(--ink)}
.nav button::before{content:"";display:block;width:28px;height:3px;border-radius:2px;margin:-12px auto 9px;background:transparent}
.nav button.on::before{background:var(--in)}

/* Botones y campos */
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-size:17px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.seg.kind button.on[data-v="out"]{color:var(--out)}
.seg.kind button.on[data-v="in"]{color:var(--in)}
.two{display:flex;gap:10px;align-items:center}
.two .inp{text-align:center}

/* Hoja inferior */
.backdrop{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:20;display:none}
.backdrop.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;z-index:21;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;max-width:600px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:19px}
.parts{border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin-top:6px}
.part{padding:10px 0;border-top:1px solid var(--soft)}
.part:first-child{border-top:0}
.part .r1{display:flex;gap:8px}
.part .r1 .inp:first-child{flex:0 0 38%}
.part .r2{display:flex;gap:8px;align-items:center;margin-top:8px}
.part .r2 select{flex:1}
.part .r2 .inp.sm{width:56px;text-align:center;padding:10px 4px}
.x{border:0;background:transparent;color:var(--out);font-size:22px;width:36px;height:40px}
.linkbtn{border:0;background:transparent;color:var(--in);font-weight:700;padding:10px 0}
.actions{display:flex;gap:10px;margin-top:18px}
.total-line{display:flex;justify-content:space-between;padding:10px 2px 4px;font-weight:700}

/* Cuentas */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.acc{display:flex;gap:8px;align-items:center;margin:8px 0}
.acc .inp:first-child{flex:1}
.acc .inp.money{width:34%;text-align:right}
.accsum{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:12px;padding-top:10px;font-weight:800;font-size:22px}
h1.page{font-size:24px;margin:8px 0 2px}
p.sub{color:var(--muted);margin:0 0 10px;font-size:14px}
.menu .btn{margin:8px 0;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;gap:16px;align-items:center}
.toast.act button{border:0;background:transparent;color:var(--in);font-weight:800;font-size:15px;padding:4px 0}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
textarea.inp{min-height:180px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.cob{padding:12px 0;border-top:1px solid var(--soft)}
.cob:first-of-type{border-top:0}
.cob .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:none;border:0;padding:0;width:100%;text-align:left}
.cob .hd b{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.cob .btn{margin-top:10px;padding:11px 14px}
.cardh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.cardh h2{margin:0;font-size:17px}
.cardh span{color:var(--muted);font-size:13px}
.movs{margin:4px -16px 0}
.movs .closing{padding:12px 16px}
.movs .closing.edit{width:100%;border:0;border-top:2px dashed var(--line);background:none;font:inherit;color:inherit;text-align:left}
.startline{display:flex;justify-content:space-between;padding:10px 16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--soft);font-weight:700}
.btnrow{display:flex;gap:10px;padding:4px 16px}
.btnrow .linkbtn{flex:1;text-align:left}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.abl{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--soft);padding:4px 0}
.now{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;margin:4px 0 12px;border:0;width:100%;text-align:left}
.now span{font-size:14px;opacity:.75}
.now b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.diff{margin-top:12px;font-size:14px;color:var(--muted)}
.diff b{color:var(--ink)}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px;margin:22px 0 10px}
.chart h2{margin:0 4px 2px;font-size:17px}
.chart .sub{margin:0 4px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 4px 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cscroll{overflow-x:auto}
.ctab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ctab th,.ctab td{padding:7px 4px;text-align:right;border-top:1px solid var(--soft);white-space:nowrap}
.ctab th:first-child,.ctab td:first-child{text-align:left;text-transform:capitalize}
.ctab thead th{color:var(--muted);font-weight:600;border-top:0}
.ctab tr.on td{font-weight:800}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
#lock.show{display:flex}
.lk-logo{margin-bottom:14px}
.lk-title{font-size:22px;font-weight:800;margin:0 0 6px;text-align:center}
.lk-sub{color:var(--muted);font-size:14px;min-height:20px;margin:0 0 18px;text-align:center;max-width:300px}
.lk-sub.err{color:var(--out);font-weight:700}
.dots{display:flex;gap:14px;margin-bottom:30px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-9px)}60%{transform:translateX(9px)}100%{transform:none}}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 24px}
.pad button{width:74px;height:74px;border-radius:50%;border:0;background:var(--paper);font-size:28px;font-weight:600;box-shadow:0 0 0 1px var(--line)}
.pad button:active{background:var(--soft)}
.pad button.txt{background:transparent;box-shadow:none;font-size:14px;font-weight:700;color:var(--muted)}
.pad button.ok{background:var(--in);color:#FFFFFF;box-shadow:none;font-size:16px;font-weight:800}
.lk-foot{margin-top:24px}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="hint" style="margin-top:40vh">Cargando…</p></div>
<nav class="nav" id="nav">
  <button data-view="mes" class="on">Mes</button>
  <button data-view="ahorro">Ahorro</button>
  <button data-view="cuentas">Cuentas</button>
  <button data-view="respaldo">Más</button>
</nav>
<div class="backdrop" id="bd"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Bloqueo con PIN"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const SECC=["Día 1","Día 15","Fin de mes"];
const REP={mensual:"Cada mes",bimestral:"Cada 2 meses",unico:"Solo este mes",msi:"A meses"};
const LS="finanzas-v1";
const OFFLINE=true;

let S={config:{accounts:[],accountsDate:""},months:{},ahorro:null};
function normAhorro(a){a=a&&typeof a==="object"?a:{};if(!Array.isArray(a.accounts))a.accounts=[];if(!Array.isArray(a.movs))a.movs=[];if(!Array.isArray(a.cobrar))a.cobrar=[];a.cobrar.forEach(c=>{if(!Array.isArray(c.abonos))c.abonos=[]});if(a.date==null)a.date="";return a}
let cur=null, view="mes", mode="cargando";
let db=null, col=null, uid=null, downloads=null;
const dirty=new Set(), chains={};
let flushT=null;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const uidGen=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
const money=n=>"$"+Math.abs(n).toLocaleString("es-MX",{maximumFractionDigits:2});
const smoney=n=>(n<0?"−":"+")+money(n);
const clone=o=>JSON.parse(JSON.stringify(o));
function keyParts(k){const[y,m]=k.split("-").map(Number);return{y,m}}
function addMonths(k,d){let{y,m}=keyParts(k);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")}
function mName(k){const{y,m}=keyParts(k);return MESES[m-1]+" "+y}
function lastDay(k){const{y,m}=keyParts(k);return new Date(y,m,0).getDate()}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function keys(){return Object.keys(S.months).sort()}
function toast(t,undo){const e=$("#toast");e.classList.toggle("act",!!undo);
  if(undo){e.innerHTML='<span>'+esc(t)+'</span><button data-act="undo">Deshacer</button>'}else e.textContent=t;
  e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>{e.classList.remove("show","act")},undo?5000:2600)}

/* ---------- cálculos ---------- */
function itemAmount(it){return it.parts&&it.parts.length?it.parts.reduce((a,p)=>a+num(p.amount),0):num(it.amount)}
function signed(it){return it.kind==="in"?itemAmount(it):-itemAmount(it)}
function anchorKey(){
  if(!S.config.accounts.length)return null;
  const k=(S.config.accountsDate||todayISO()).slice(0,7);
  return S.months[k]?k:null;
}
function doneSum(m){let b=0;m.sections.forEach(s=>s.items.forEach(it=>{if(it.done)b+=signed(it)}));return b}
function reflSum(m){const r=S.config.reflected||[];let b=0;m.sections.forEach(s=>s.items.forEach(it=>{if(it.done&&r.includes(it.id))b+=signed(it)}));return b}
function unreflected(m){const r=S.config.reflected||[];let n=0;m.sections.forEach(s=>s.items.forEach(it=>{if(it.done&&!r.includes(it.id))n++}));return n}
function snapReflected(){const k=anchorKey();const ids=[];if(k)S.months[k].sections.forEach(s=>s.items.forEach(it=>{if(it.done)ids.push(it.id)}));S.config.reflected=ids}
function opening(k,natural){
  const ks=keys(),anc=natural?null:anchorKey();let bal=0;
  for(const kk of ks){
    const m=S.months[kk];
    if(kk===anc)bal=accTotal()-reflSum(m);
    else if(m.opening!=null&&m.opening!=="")bal=num(m.opening);
    if(kk===k)return bal;
    bal=closingFrom(m,bal);
  }
  return bal;
}
function freezeAnchor(old){
  const n=anchorKey();
  if(old&&old!==n&&S.months[old]){S.months[old].opening=Math.round(oldOpen*100)/100;persist(old)}
}
let oldOpen=0;
function closingFrom(m,start){let b=start;m.sections.forEach(s=>s.items.forEach(it=>b+=signed(it)));return b}
function balances(k){
  const m=S.months[k];let b=opening(k);const out=[];
  let inc=0,exp=0;
  m.sections.forEach(s=>{s.items.forEach(it=>{const v=signed(it);b+=v;if(v>0)inc+=v;else exp-=v});out.push(b)});
  return{open:opening(k),after:out,close:b,inc,exp};
}

/* ---------- crear mes nuevo ---------- */
function carryPart(p){
  if(p.repeat==="unico")return null;
  const q=clone(p);q.id=uidGen();
  if(q.repeat==="msi"){if(num(q.n)>=num(q.N))return null;q.n=num(q.n)+1}
  return q;
}
function carryItem(it){
  if(it.repeat==="unico"||it.repeat==="bimestral")return null;
  const q=clone(it);q.id=uidGen();q.done=false;
  if(q.repeat==="msi"){if(num(q.n)>=num(q.N))return null;q.n=num(q.n)+1}
  if(it.parts&&it.parts.length){q.parts=it.parts.map(carryPart).filter(Boolean);if(!q.parts.length)return null}
  return q;
}
function emptyMonth(k){return{key:k,opening:null,sections:SECC.map(n=>({name:n,items:[]}))}}
function generate(k){
  const prevK=addMonths(k,-1),prev2K=addMonths(k,-2);
  const m=emptyMonth(k);
  const prev=S.months[prevK],prev2=S.months[prev2K];
  if(prev)prev.sections.forEach((s,i)=>s.items.forEach(it=>{const c=carryItem(it);if(c)m.sections[i].items.push(c)}));
  if(prev2)prev2.sections.forEach((s,i)=>s.items.forEach(it=>{if(it.repeat==="bimestral"){const c=clone(it);c.id=uidGen();c.done=false;m.sections[i].items.push(c)}}));
  return m;
}

/* ---------- guardado ---------- */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const t=localStorage.getItem(LS);if(t){const o=JSON.parse(t);if(o&&o.months)return o}}catch(e){}return null}
function persist(k){
  saveLocal();
  if(mode!=="nube")return;
  dirty.add(k);clearTimeout(flushT);flushT=setTimeout(flush,500);
}
function flush(){for(const k of Array.from(dirty))writeDoc(k)}
function writeDoc(k){
  const id=(k==="config"||k==="ahorro")?k:"mes_"+k;
  const p=(chains[id]||Promise.resolve()).then(async()=>{
    const data=k==="config"?S.config:k==="ahorro"?S.ahorro:S.months[k];
    const ref=col.doc(id);
    try{
      if(data)await ref.set(clone(data));else await ref.delete();
    }catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*700));try{data?await ref.set(clone(data)):await ref.delete()}catch(e2){toast("No se pudo guardar en la nube; queda guardado en este equipo.")}}
      else if(e&&e.code==="quota_exceeded")toast("Se llenó el espacio de la nube. Descarga un respaldo y elimina meses viejos.");
      else toast("No se pudo guardar en la nube; queda guardado en este equipo.");
    }
  });
  chains[id]=p;dirty.delete(k);
  p.then(()=>{if(chains[id]===p)delete chains[id]});
}
function applySnap(snap){
  const months={};let config=null,ahorro=null;
  snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==="config")config=v;else if(d.id==="ahorro")ahorro=clone(v);else if(d.id.startsWith("mes_"))months[d.id.slice(4)]=clone(v)});
  // conservar lo que aún no se ha subido
  const keep=k=>{if(k==="config")config=S.config;else if(k==="ahorro")ahorro=S.ahorro;else if(S.months[k])months[k]=S.months[k];else delete months[k]};
  for(const k of dirty)keep(k);
  for(const id in chains)keep(id.startsWith("mes_")?id.slice(4):id);
  S={config:config?clone(config):{accounts:[],accountsDate:""},months,ahorro:normAhorro(ahorro)};
  if(!S.config.accounts)S.config.accounts=[];
  pickCurrent();saveLocal();
  if(!sheetOpen)render();
}
function pickCurrent(){

async function init(){
  const cached=loadLocal();
  if(cached){S=cached;S.ahorro=normAhorro(S.ahorro);pickCurrent();render()}
  const c=window.claude;
  if(!(c&&typeof c.use==="function"))return startLocal();
  try{
    c.use("downloads").then(d=>{downloads=d;if(view==="respaldo")render()}).catch(()=>{});
    const[d,u]=await Promise.all([c.use("db"),c.use("user")]);
    if(!d||!u)return startLocal();
    const id=await u.id();
    if(!id)return startLocal();
    db=d;uid=id;mode="nube";
    col=db.collection("data/users/"+uid);
    col.onSnapshot(applySnap,err=>{mode="local";toast("Se perdió la conexión con la nube. Recarga la página para reconectar.");render()});
  }catch(e){startLocal()}
}
function startLocal(){

}

function chartHTML(){
  const ks=keys();if(!ks.length)return"";
  const data=ks.map(k=>({k,v:balances(k).after}));
  const all=data.flatMap(d=>d.v);let mx=Math.max(0,...all),mn=Math.min(0,...all);if(mx===mn)mx=1;
  const n=data.length,gw=Math.max(60,276/n),bw=Math.min(26,Math.floor((gw-16)/3)),W=Math.max(320,n*gw+48),H=200,top=12,bot=26,ch=H-top-bot;
  const y=v=>top+(mx-v)/(mx-mn)*ch;
  const cols=["var(--c1)","var(--ink)","var(--in)"],names=["Al 15","Antes de fin de mes","Cierre"];
  let g='';
  // líneas guía
  const step=niceStep((mx-mn)/4);
  for(let t=Math.ceil(mn/step)*step;t<=mx+1e-6;t+=step){const yy=y(t).toFixed(1);g+='<line x1="40" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--soft)" stroke-width="1"/><text x="36" y="'+(+yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+short(t)+'</text>'}
  g+='<line x1="40" x2="'+W+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="var(--line)" stroke-width="1.5"/>';
  data.forEach((d,i)=>{
    const x0=44+i*gw+(gw-(3*bw+4))/2;
    d.v.forEach((v,j)=>{const y1=y(Math.max(v,0)),y2=y(Math.min(v,0));g+='<rect x="'+(x0+j*(bw+2))+'" y="'+y1.toFixed(1)+'" width="'+bw+'" height="'+Math.max(1,y2-y1).toFixed(1)+'" rx="2" fill="'+(v<0?"var(--out)":cols[j])+'"><title>'+names[j]+': '+sm(v)+'</title></rect>'});
    g+='<text x="'+(x0+(3*bw+4)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" font-weight="'+(d.k===cur?800:500)+'" fill="'+(d.k===cur?"var(--ink)":"var(--muted)")+'">'+MESC[keyParts(d.k).m-1]+(keyParts(d.k).m===1||i===0?" "+String(keyParts(d.k).y).slice(2):"")+'</text>';
  });
  let h='<div class="chart"><h2>Histórico de cortes</h2><p class="sub">Tu saldo en los tres cortes de cada mes.</p>'+
    '<div class="legend">'+names.map((nm,j)=>'<span><i style="background:'+cols[j]+'"></i>'+nm+'</span>').join("")+'</div>'+
    '<div class="cscroll"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="max-width:none;display:block" role="img" aria-label="Gráfica de saldos por mes">'+g+'</svg></div>';
  h+='<div class="cscroll"><table class="ctab num"><thead><tr><th>Mes</th><th>Al 15</th><th>Antes de fin</th><th>Cierre</th></tr></thead><tbody>'+
    data.slice().reverse().map(d=>'<tr class="'+(d.k===cur?"on":"")+'"><td>'+MESC[keyParts(d.k).m-1]+" "+String(keyParts(d.k).y).slice(2)+'</td>'+d.v.map(v=>'<td class="'+(v<0?"neg":"")+'">'+sm(v)+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div></div>';
  return h;
}
function niceStep(r){if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}

function monthText(k){
  const m=S.months[k];const b=balances(k);const mesN=MESES[keyParts(k).m-1];

  L.push("Saldo inicial "+money(b.open));

        L.push(p+"="+sg+money(itemAmount(it))+" ("+it.concept+")"+(it.note?" "+it.note:""));

    it.parts=it.parts.filter(p=>num(p.amount)!==0).map(p=>({id:p.id||uidGen(),label:(p.label||"").trim(),amount:num(p.amount),repeat:p.repeat||"mensual",n:num(p.n)||1,N:num(p.N)||1}));
    if(!it.parts.length){toast("Agrega al menos un cargo.");return}
    it.amount=itemAmount(it);
  }else{it.parts=[];it.amount=num(it.amount)}
  if(it.repeat==="msi"){it.n=Math.max(1,Math.round(num(it.n)));it.N=Math.max(it.n,Math.round(num(it.N)))}else{delete it.n;delete it.N}
  const m=S.months[cur];
  if(draft.ii!=null)m.sections[draft.orig].items.splice(draft.ii,1);
  if(draft.ii!=null&&draft.orig===draft.si)m.sections[draft.si].items.splice(draft.ii,0,it);
  else m.sections[draft.si].items.push(it);
  persist(cur);closeSheet();
}

async function save(filename,data){
  const cap=window.Capacitor;
  if(!downloads&&cap&&cap.isNativePlatform&&cap.isNativePlatform()){
    try{
      const FS=cap.Plugins.Filesystem,SH=cap.Plugins.Share;
      const r=await FS.writeFile({path:filename,data:typeof data==="string"?data:await new Response(data).text(),directory:"CACHE",encoding:"utf8"});
      await SH.share({title:filename,dialogTitle:"Guardar o enviar "+filename,url:r.uri});
    }catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("No se pudo compartir el archivo.")}
    return;
  }
  if(!downloads){
    try{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/plain"}));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
    catch(e){toast("No se pudo descargar el archivo.")}
    return;
  }
  try{await downloads.save({filename,data});}
  catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rate_limited"?"Espera un momento e inténtalo de nuevo.":"No se pudo descargar el archivo.")}
}
function importData(o){

  for(const k of new Set([...old,...keys()]))persist(k);

}

const MESC=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(d){if(!d)return"";const[y,m,dd]=d.split("-").map(Number);return dd+" de "+MESES[m-1]}
function shortDate(d){if(!d)return"";const[y,m,dd]=d.split("-").map(Number);return dd+" "+MESC[m-1]}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const sumAcc=l=>l.reduce((a,c)=>a+num(c.amount),0);
const movVal=m=>(m.kind==="in"?1:-1)*(num(m.qty)||1)*num(m.amount);
const cobRest=c=>num(c.total)-c.abonos.reduce((a,x)=>a+num(x.amount),0);
function ahorroCalc(){const A=S.ahorro;const base=sumAcc(A.accounts);let run=base;const runs=[];A.movs.forEach(m=>{if(m.type!=="corte")run+=movVal(m);runs.push(run)});return{base,runs,total:run,cob:A.cobrar.reduce((a,c)=>a+Math.max(0,cobRest(c)),0)}}

/* ---------- deslizar para eliminar ---------- */
let sw=null,suppressClick=false,lastDel=null;
document.addEventListener("pointerdown",e=>{
  const w=e.target.closest(".sw");if(!w||(e.pointerType==="mouse"&&e.button!==0))return;
  sw={w,it:w.querySelector(".item"),x:e.clientX,y:e.clientY,dx:0,active:false,id:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.active){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4){sw.active=true;sw.it.classList.add("dragging")}
    else if(Math.abs(dy)>10){sw=null;return}
    else return;
  }
  sw.dx=Math.min(0,dx);sw.it.style.transform="translateX("+sw.dx+"px)";
});
function endSwipe(){
  if(!sw)return;const s=sw;sw=null;if(!s.active)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,400);
  s.it.classList.remove("dragging");
  if(s.dx<-Math.min(110,s.w.offsetWidth*0.33)){s.it.style.transform="translateX(-105%)";setTimeout(()=>swipeDelete(s.w),180)}
  else s.it.style.transform="";
}
document.addEventListener("pointerup",endSwipe);
document.addEventListener("pointercancel",()=>{if(sw){sw.it.classList.remove("dragging");sw.it.style.transform="";sw=null}});
document.addEventListener("click",e=>{if(suppressClick&&e.target.closest(".sw")){e.stopPropagation();e.preventDefault();suppressClick=false}},true);
function swipeDelete(w){
  const i=+w.dataset.i;let it;
  if(w.dataset.sw==="m"){const s=+w.dataset.s;it=S.months[cur].sections[s].items.splice(i,1)[0];lastDel={kind:"m",key:cur,s,i,it};persist(cur)}
  else{it=S.ahorro.movs.splice(i,1)[0];lastDel={kind:"a",i,it};persist("ahorro")}
  render();toast("Eliminado: "+(it.concept||"concepto"),true);
}
function undoDelete(){
  const d=lastDel;if(!d)return;lastDel=null;
  if(d.kind==="m"){const m=S.months[d.key];if(!m)return;m.sections[d.s].items.splice(Math.min(d.i,m.sections[d.s].items.length),0,d.it);persist(d.key)}
  else{S.ahorro.movs.splice(Math.min(d.i,S.ahorro.movs.length),0,d.it);persist("ahorro")}
  const e=$("#toast");e.classList.remove("show","act");render();
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const nb=e.target.closest("#nav button");
  if(nb){view=nb.dataset.view;render();window.scrollTo(0,0);return}
  if(e.target.id==="bd"){closeSheet();return}
  const sk=e.target.closest("[data-sk]");
  if(sk&&draft){
    readSheet();const v=sk.dataset.v;
    if(sk.dataset.sk==="kind")draft.it.kind=v;
    if(sk.dataset.sk==="sec")draft.si=+v;
    if(sk.dataset.sk==="parts"){
      draft.useParts=v==="1";
      if(draft.useParts&&!draft.it.parts.length)draft.it.parts=[{id:uidGen(),label:"",amount:draft.it.amount||"",repeat:"mensual",n:1,N:6}];
      if(!draft.useParts&&draft.it.parts.length){draft.it.amount=itemAmount(draft.it);draft.it.parts=[]}
    }
    drawSheet();return;
  }
  const tg=e.target.closest("[data-tog]");
  if(tg){tg.parentElement.querySelectorAll("[data-tog]").forEach(x=>x.classList.toggle("on",x===tg));return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,ks=keys();
  switch(a){
    case "prev":{const i=ks.indexOf(cur);if(i>0){cur=ks[i-1];render()}break}
    case "next":{const i=ks.indexOf(cur);if(i<ks.length-1){cur=ks[i+1];render()}break}
    case "menu":monthMenu();break;
    case "done":{const it=S.months[cur].sections[+b.dataset.s].items[+b.dataset.i];it.done=!it.done;persist(cur);render();break}
    case "edit":editItem(+b.dataset.s,+b.dataset.i);break;
    case "add":editItem(+b.dataset.s,null);break;
    case "addpart":readSheet();draft.it.parts.push({id:uidGen(),label:"",amount:"",repeat:"mensual",n:1,N:6});drawSheet();
      setTimeout(()=>{const els=document.querySelectorAll('[data-p="amount"]');if(els.length)els[els.length-1].focus()},50);break;
    case "delpart":readSheet();draft.it.parts.splice(+b.dataset.pi,1);drawSheet();break;
    case "cancel":closeSheet();break;
    case "saveitem":saveItem();break;
    case "delitem":if(confirm("¿Eliminar este concepto?")){S.months[cur].sections[draft.orig].items.splice(draft.ii,1);persist(cur);closeSheet()}break;
    case "newmonth":{const nk=addMonths(ks[ks.length-1],1);S.months[nk]=generate(nk);cur=nk;persist(nk);render();window.scrollTo(0,0);toast(mName(nk)+" creado.");break}
    case "first":{const k=b.dataset.k;const m=emptyMonth(k);if(S.config.accounts.length)m.opening=accTotal();S.months[k]=m;cur=k;persist(k);render();break}
    case "delmonth":if(confirm("¿Eliminar "+mName(cur)+" y todos sus conceptos?")){const k=cur;delete S.months[k];cur=null;pickCurrent();persist(k);closeSheet()}break;
    case "clearopen":S.months[cur].opening=null;persist(cur);closeSheet();break;
    case "showtxt":showText("page");break;
    case "showtxt2":showText("sheet");break;
    case "copy":copyText();break;
    case "addacc":S.config.accounts.push({id:uidGen(),name:"",amount:""});persist("config");render();
      setTimeout(()=>{const els=document.querySelectorAll('[data-acc="name"]');if(els.length)els[els.length-1].focus()},50);break;
    case "delacc":S.config.accounts.splice(+b.dataset.i,1);snapReflected();persist("config");render();break;
    case "gocuentas":view="cuentas";render();window.scrollTo(0,0);break;
    case "dljson":save("finanzas-respaldo-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(S,null,1));break;
    case "dltxt":save("finanzas-"+cur+".txt",monthText(cur));break;
    case "import":$("#fileIn").click();break;
    case "pinset":closeSheetQuiet();showLock("set1");break;
    case "pinchange":showLock("old-change");break;
    case "pinremove":showLock("old-remove");break;
    case "pinlock":showLock("unlock");break;
    case "pinlater":try{localStorage.setItem(PINASK,"1")}catch(e){}closeSheet();break;
    case "undo":undoDelete();break;
    case "showatxt":{const o=$("#txtout");if(o)o.innerHTML='<div class="card"><label class="field"><span>Mantén presionado para seleccionar y copiar</span><textarea class="inp" readonly id="txtarea">'+esc(ahorroText())+'</textarea></label><button class="btn" data-act="copy">Copiar texto</button></div>';break}
    case "dlatxt":save("ahorro-"+new Date().toISOString().slice(0,10)+".txt",ahorroText());break;
    case "saddacc":S.ahorro.accounts.push({id:uidGen(),name:"",amount:""});persist("ahorro");render();
      setTimeout(()=>{const els=document.querySelectorAll('[data-acc="name"][data-tgt="ah"]');if(els.length)els[els.length-1].focus()},50);break;
    case "sdelacc":S.ahorro.accounts.splice(+b.dataset.i,1);persist("ahorro");render();break;
    case "adone":{const m=S.ahorro.movs[+b.dataset.i];m.done=!m.done;persist("ahorro");render();break}
    case "aedit":movSheet(+b.dataset.i);break;
    case "aadd":movSheet(null);break;
    case "acorte":S.ahorro.movs.push({id:uidGen(),type:"corte",label:"Ahorro"});persist("ahorro");render();break;
    case "asave":saveMov();break;
    case "adel":if(confirm("¿Eliminar este renglón?")){S.ahorro.movs.splice(aDraft.i,1);persist("ahorro");closeSheet()}break;
    case "amove":{const i=aDraft.i,j=i+(+b.dataset.d),L=S.ahorro.movs;if(j<0||j>=L.length)break;if(!saveMov(true))break;[L[i],L[j]]=[L[j],L[i]];aDraft.i=j;persist("ahorro");render();toast(+b.dataset.d<0?"Subido.":"Bajado.");break}
    case "aclean":if(confirm("Se quitan los movimientos marcados como realizados. Hazlo después de actualizar los saldos de tus cuentas de ahorro. ¿Continuar?")){cleanDone();persist("ahorro");render()}break;
    case "cadd":cobSheet(null);break;
    case "cedit":cobSheet(+b.dataset.i);break;
    case "csave":saveCob();break;
    case "cdel":if(confirm("¿Eliminar este proyecto por cobrar y sus abonos?")){S.ahorro.cobrar.splice(cDraft.i,1);persist("ahorro");closeSheet()}break;
    case "delabono":readCob();cDraft.c.abonos.splice(+b.dataset.ai,1);drawCob();break;
    case "abono":abonoSheet(+b.dataset.i);break;
    case "absave":saveAbono();break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="msel"){cur=e.target.value;render();return}
  if(e.target.id==="f-repeat"&&draft){readSheet();drawSheet();return}
  if(e.target.matches('select[data-p="repeat"]')&&draft){readSheet();drawSheet();return}
  if(e.target.id==="fileIn"){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(confirm("Esto reemplaza todos tus datos actuales por los del respaldo. ¿Continuar?"))importData(o)}catch(err){toast("Ese archivo no es un respaldo de esta app.")}e.target.value=""};
    r.readAsText(f);return;
  }
  const ac=e.target.dataset&&e.target.dataset.acc;
  if(ac){
    const ah=e.target.dataset.tgt==="ah";const list=ah?S.ahorro.accounts:S.config.accounts;
    const oldA=ah?null:anchorKey();if(oldA)oldOpen=opening(oldA);
    if(ac==="date"){if(ah)S.ahorro.date=e.target.value;else S.config.accountsDate=e.target.value}
    else{
      list[+e.target.dataset.i][ac]=ac==="amount"?num(e.target.value):e.target.value;
      if(ac==="amount"){const t=todayISO();if(ah)S.ahorro.date=t;else S.config.accountsDate=t}
    }
    if(!ah){freezeAnchor(oldA);snapReflected()}
    persist(ah?"ahorro":"config");
    renderKeep();
  }
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.acc==="amount"&&e.target.dataset.tgt!=="ah"){
    const t=S.config.accounts.reduce((a,c,i)=>a+(i===+e.target.dataset.i?num(e.target.value):num(c.amount)),0);
    const o=$("#acctot");if(o)o.textContent=sm(t);
  }
  if(e.target.dataset&&e.target.dataset.p==="amount"&&draft){
    readSheet();const tl=document.querySelector(".total-line span:last-child");if(tl)tl.textContent=money(itemAmount(draft.it));
  }
});
function renderKeep(){
  setTimeout(()=>{
    const a=document.activeElement;let sel=null;
    if(a&&a!==document.body&&a.dataset&&Object.keys(a.dataset).length)sel=Object.entries(a.dataset).map(([k,v])=>'[data-'+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())+'="'+v+'"]').join("");
    const y=window.scrollY;render();window.scrollTo(0,y);
    if(sel){const n=document.querySelector(sel);if(n)n.focus({preventScroll:true})}
  },0);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen)closeSheet()});
window.addEventListener("beforeunload",()=>{if(mode==="nube"&&dirty.size)flush()});

/* ---------- PIN de acceso ---------- */
const PINK="finanzas-pin",PINASK="finanzas-pin-asked";
function pinData(){try{return JSON.parse(localStorage.getItem(PINK)||"null")}catch(e){return null}}
async function hashPin(pin,salt){
  const t=salt+":"+pin;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}
  let h1=5381,h2=52711;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=(h1*33)^c;h2=(h2*33)^c}return "x"+(h1>>>0).toString(16)+(h2>>>0).toString(16);
}
let lk=null,fails=0,waitUntil=0,hiddenAt=0;
const LOGO='<svg class="lk-logo" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#000"/><rect x="12" y="30" width="10" height="16" rx="2" fill="#969696"/><rect x="27" y="24" width="10" height="22" rx="2" fill="#fff"/><rect x="42" y="13" width="10" height="33" rx="2" fill="#36C46B"/><rect x="10" y="49" width="44" height="2.5" rx="1" fill="#fff"/></svg>';
function closeSheetQuiet(){$("#bd").classList.remove("show");$("#sheet").classList.remove("show");sheetOpen=false;draft=null}
function showLock(mode,auto){lk={mode,entry:"",first:"",auto:!!auto,msg:"",err:false};drawLock();$("#lock").classList.add("show")}
function hideLock(){lk=null;$("#lock").classList.remove("show");$("#lock").innerHTML=""}
function drawLock(){
  if(!lk)return;
  const pd=pinData();
  const T={unlock:["Mis finanzas","Escribe tu PIN"],set1:["Nuevo PIN","Escribe de 4 a 6 números y toca OK"],set2:["Confirma tu PIN","Escríbelo otra vez"],"old-change":["Cambiar PIN","Escribe tu PIN actual"],"old-remove":["Quitar PIN","Escribe tu PIN actual"]}[lk.mode];
  const n=(lk.mode==="unlock"||lk.mode.startsWith("old"))&&pd?pd.len:lk.mode==="set2"?lk.first.length:Math.max(4,lk.entry.length);
  let d="";for(let i=0;i<n;i++)d+='<i class="'+(i<lk.entry.length?"on":"")+'"></i>';
  const left=lk.mode==="unlock"?'<button class="txt" data-pin="forgot">Olvidé mi PIN</button>':'<button class="txt" data-pin="cancel">Cancelar</button>';
  const right=lk.mode==="set1"&&lk.entry.length>=4?'<button class="ok" data-pin="ok">OK</button>':'<button class="txt" data-pin="del" aria-label="Borrar">⌫</button>';
  let pad="";for(let i=1;i<=9;i++)pad+='<button data-pin="'+i+'">'+i+'</button>';
  pad+=left+'<button data-pin="0">0</button>'+right;
  $("#lock").innerHTML=LOGO+'<p class="lk-title">'+T[0]+'</p><p class="lk-sub'+(lk.err?" err":"")+'">'+esc(lk.msg||T[1])+'</p><div class="dots" id="dots">'+d+'</div><div class="pad">'+pad+'</div>'+
    (lk.mode==="set1"&&lk.entry.length>=4?'':(lk.mode==="set1"?'':''))+'';
}
function lockErr(msg){lk.entry="";lk.msg=msg;lk.err=true;drawLock();const d=$("#dots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake")}if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}}
async function pinKey(k){
  if(!lk)return;
  if(k==="cancel"){hideLock();render();return}
  if(k==="forgot"){
    if(confirm("Si olvidaste tu PIN, la única forma de entrar es borrar los datos guardados en este equipo y restaurar un respaldo después. ¿Borrar los datos de este equipo?")&&confirm("¿Seguro? Esto no se puede deshacer.")){
      try{localStorage.removeItem(LS);localStorage.removeItem(PINK)}catch(e){}
      location.reload();
    }
    return;
  }
  if(k==="del"){lk.entry=lk.entry.slice(0,-1);lk.err=false;lk.msg="";drawLock();return}
  if(Date.now()<waitUntil){lk.msg="Demasiados intentos. Espera unos segundos.";lk.err=true;drawLock();return}
  const pd=pinData();
  if(k==="ok"){if(lk.mode==="set1"&&lk.entry.length>=4){lk.first=lk.entry;lk.entry="";lk.mode="set2";lk.msg="";lk.err=false;drawLock()}return}
  if(!/^\d$/.test(k))return;
  const max=(lk.mode==="unlock"||lk.mode.startsWith("old"))&&pd?pd.len:lk.mode==="set2"?lk.first.length:6;
  if(lk.entry.length>=max)return;
  lk.entry+=k;lk.err=false;lk.msg="";drawLock();
  if(lk.entry.length<max)return;
  if(lk.mode==="set1"){lk.first=lk.entry;lk.entry="";lk.mode="set2";drawLock();return}
  if(lk.mode==="set2"){
    if(lk.entry!==lk.first){lk.mode="set1";lk.first="";lockErr("No coinciden. Escribe tu nuevo PIN otra vez.");return}
    const salt=Math.random().toString(36).slice(2,12);
    try{localStorage.setItem(PINK,JSON.stringify({salt,len:lk.entry.length,hash:await hashPin(lk.entry,salt)}));localStorage.setItem(PINASK,"1")}catch(e){}
    hideLock();render();toast("PIN guardado.");return;
  }
  // unlock / old-*
  const ok=pd&&(await hashPin(lk.entry,pd.salt))===pd.hash;
  if(!ok){fails++;if(fails>=5){waitUntil=Date.now()+30000;fails=0;lockErr("Demasiados intentos. Espera 30 segundos.")}else lockErr("PIN incorrecto");return}
  fails=0;
  if(lk.mode==="unlock"){hideLock();return}
  if(lk.mode==="old-change"){lk.mode="set1";lk.entry="";lk.msg="";drawLock();return}
  if(lk.mode==="old-remove"){try{localStorage.removeItem(PINK)}catch(e){}hideLock();render();toast("PIN quitado.");return}
}
$("#lock").addEventListener("click",e=>{const b=e.target.closest("[data-pin]");if(b)pinKey(b.dataset.pin)});
document.addEventListener("keydown",e=>{if(!lk)return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("del");else if(e.key==="Enter")pinKey("ok");e.stopPropagation()},true);
document.addEventListener("visibilitychange",()=>{
  if(!pinData())return;
  if(document.hidden){hiddenAt=Date.now();if(!lk)showLock("unlock",true)}
  else if(lk&&lk.auto&&lk.mode==="unlock"&&!lk.entry&&Date.now()-hiddenAt<60000)hideLock();
  else if(lk)lk.auto=false;
});
if(pinData())showLock("unlock");

init();
setTimeout(()=>{
  let asked=false;try{asked=!!localStorage.getItem(PINASK)}catch(e){}
  if(!pinData()&&!asked&&!lk&&!sheetOpen)openSheet('<h3>¿Proteger la app con un PIN?</h3><p class="sub">Te pedirá un PIN de 4 a 6 números cada vez que la abras. Lo puedes cambiar o quitar en la pestaña Más.</p><div class="actions"><button class="btn ghost" data-act="pinlater">Ahora no</button><button class="btn" data-act="pinset">Poner PIN</button></div>');
},900);
if(!window.Capacitor&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
