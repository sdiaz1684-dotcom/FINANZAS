name: Construir app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar proyecto Capacitor
        run: |
          mkdir build && cd build
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          mkdir www
          cp ../index.html ../manifest.webmanifest ../icon-*.png ../apple-touch-icon.png www/
          echo '{"appId":"mx.misfinanzas.app","appName":"Finanzas","webDir":"www","android":{"backgroundColor":"#000000"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Poner el ícono
        run: |
          RES=build/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-icons/mipmap-$d/*.png $RES/mipmap-$d/
          done

      - name: Compilar y firmar APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cd build
          VER=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode $VER/; s/versionName \"1.0\"/versionName \"1.$VER\"/" android/app/build.gradle
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/finanzas.jks
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/finanzas.jks --ks-key-alias finanzas \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS \
            --out ../../Finanzas.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify ../../Finanzas.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Finanzas 1.${{ github.run_number }}
          body: Descarga Finanzas.apk desde el celular e instálalo.
          files: Finanzas.apk
